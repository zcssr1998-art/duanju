<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="短剧">
<meta name="theme-color" content="#0a0a0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>短剧</title>
<style>
:root{--bg:#0a0a0c;--card:#16161c;--card2:#1d1d24;--line:#272730;--txt:#f3f3f6;--dim:#8b8b9a;--dim2:#5d5d6b;--acc:#ff4d6d;--gold:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overscroll-behavior-y:contain}
body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
#hdr{position:sticky;top:0;z-index:30;background:rgba(10,10,12,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 7px) 14px 9px}
.bar{display:flex;align-items:center;gap:10px}
.brand{font-size:18px;font-weight:800;letter-spacing:.4px;flex:none}
.brand b{color:var(--acc)}
.sbox{flex:1;position:relative;min-width:0}
.sbox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px 8px 30px;color:var(--txt);font-size:14px;outline:none;-webkit-appearance:none}
.sbox input::placeholder{color:var(--dim2)}
.sbox .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:11.5px;padding:6px 9px;border-radius:8px;flex:none;white-space:nowrap}
.chip:active{background:#26262f}

#view{padding:0 0 20px}
.pad{padding:0 12px}

/* ── 轮播 ── */
.bn{position:relative;margin:10px 12px 4px;border-radius:16px;overflow:hidden;background:var(--card2);height:clamp(190px,40vw,360px)}
.bn .tr{display:flex;transition:transform .45s cubic-bezier(.22,.61,.36,1);will-change:transform}
.bn .sl{flex:none;width:100%;position:relative;height:100%;background:#15151b}
.bn .sl img{width:100%;height:100%;object-fit:cover;display:block}
.bn .sl .ov{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.35) 55%,transparent)}
.bn .sl .tt{font-size:14.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bn .sl .dd{color:#cfcfda;font-size:11.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.bn .sl .bd{position:absolute;left:10px;top:10px;background:rgba(255,176,32,.94);color:#231a00;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.bn .dots{position:absolute;right:10px;bottom:9px;display:flex;gap:4px;z-index:2}
.bn .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.32);transition:width .3s,background .3s}
.bn .dots i.on{width:14px;border-radius:3px;background:#fff}

/* ── 区块标题 ── */
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:16px 12px 9px}
.sec h3{margin:0;font-size:16px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.sec h3 em{font-style:normal;font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:0}
.sec .mo{color:var(--dim);font-size:12.5px;background:none;border:0;padding:2px 0}
.sec .mo:active{color:var(--acc)}

/* ── 横滑卡片 ── */
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 12px 4px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.vc{flex:none;width:112px;scroll-snap-align:start}
.vc .pw{position:relative;width:100%;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:var(--card2)}
.vc .pw img{width:100%;height:100%;object-fit:cover;display:block}
.vc .sc{position:absolute;left:6px;top:6px;background:rgba(255,77,109,.92);font-size:10.5px;font-weight:700;padding:1.5px 5px;border-radius:5px}
.vc .ep{position:absolute;right:0;left:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);font-size:10.5px;color:#e8e8f0;padding:12px 6px 4px;text-align:right}
.vc .tt{font-size:12.5px;line-height:1.32;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#e9e9f0}
.vc .sb{font-size:11px;color:var(--dim);margin-top:2px;display:flex;gap:7px;white-space:nowrap;overflow:hidden}
.vc .sb em{font-style:normal;color:var(--gold)}

/* 大卡（推荐位） */
.big{display:flex;gap:11px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.big::-webkit-scrollbar{display:none}
.bc{flex:none;width:76%;max-width:330px;background:var(--card);border-radius:14px;overflow:hidden;position:relative}
.bc .pw{position:relative;aspect-ratio:16/10;background:var(--card2)}
.bc .pw img{width:100%;height:100%;object-fit:cover;display:block}
.bc .pw:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,.15) 62%,transparent)}
.bc .ov{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 11px;z-index:1}
.bc .ov .tt{font-size:15px;font-weight:800;line-height:1.3}
.bc .ov .mt{font-size:11.5px;color:#c9c9d6;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.bc .ov .mt em{font-style:normal;color:var(--gold)}
.bc .rk{position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:7px;background:rgba(255,77,109,.94);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}

/* 网格（分类/搜索/列表） */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid .vc{width:auto}
.grid .vc .tt{font-size:13px}

/* ── 分类频道 ── */
.chan{margin-bottom:6px}
.chan-hd{display:flex;align-items:center;gap:8px;padding:14px 12px 8px}
.chan-hd .nm{font-size:15.5px;font-weight:800}
.chan-hd .ds{font-size:11.5px;color:var(--dim2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan-hd .mo{background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:11.5px;padding:3px 9px;border-radius:7px;flex:none}

.chan .row{padding-bottom:6px}
.more-card .pw{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#20202a,#15151c);border:1px dashed #33333f}
.more-card .pw span{font-size:12.5px;color:var(--dim);font-weight:600}
.more-card .tt{text-align:center;color:var(--dim)}

/* ── 专题卡 ── */
.tps{padding:0 12px;display:grid;gap:10px}
.tp{display:flex;gap:11px;background:var(--card);border-radius:13px;padding:10px}
.tp .cv{width:66px;height:88px;flex:none;border-radius:9px;overflow:hidden;background:var(--card2)}
.tp .cv img{width:100%;height:100%;object-fit:cover;display:block}
.tp .in{flex:1;min-width:0}
.tp .in .tt{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp .in .it{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp .in .ct{font-size:11px;color:var(--acc);margin-top:5px;font-weight:600}

/* ── 榜单 ── */
.rank-list{padding:0 12px}
.rk-item{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(39,39,48,.62)}
.rk-item:last-child{border:0}
.rk-no{width:26px;flex:none;text-align:center;font-size:16px;font-weight:900;color:var(--dim2);font-variant-numeric:tabular-nums}
.rk-no.t1{color:#ffd24a}.rk-no.t2{color:#c8ccd6}.rk-no.t3{color:#d08a4a}
.rk-cv{width:56px;height:74px;flex:none;border-radius:8px;overflow:hidden;background:var(--card2)}
.rk-cv img{width:100%;height:100%;object-fit:cover;display:block}
.rk-in{flex:1;min-width:0}
.rk-in .tt{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-in .mt{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.rk-in .mt em{font-style:normal;color:var(--acc);font-weight:700}
.rk-bar{height:3px;border-radius:2px;background:#242430;margin-top:6px;overflow:hidden}
.rk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff8a5c);border-radius:2px}

/* ── 详情 ── */
.det-head{display:flex;gap:13px;padding:12px 12px 0}
.det-head .cv{width:112px;flex:none;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2)}
.det-head .cv img{width:100%;height:100%;object-fit:cover;display:block}
.det-head .mt{flex:1;min-width:0}
.det-head h2{font-size:18px;margin:0 0 7px;line-height:1.3;font-weight:800}
.det-head .st{display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:var(--dim);margin-bottom:8px}
.det-head .st em{font-style:normal;color:var(--acc);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags i{font-style:normal;font-size:11px;color:#c3c3cf;background:#1e1e26;border:1px solid var(--line);padding:2px 7px;border-radius:6px}
.acts{display:flex;gap:9px;padding:14px 12px 4px}
.btn-main{flex:1;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.btn-main:active{opacity:.82}
.btn-sub{flex:none;width:52px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.btn-sub b{font-size:16px;font-weight:400}
.desc{color:#b9b9c6;font-size:13.5px;line-height:1.68;white-space:pre-wrap;margin:0;padding:0 12px;max-height:5.2em;overflow:hidden;position:relative}
.desc.on{max-height:none}
.desc:not(.on):after{content:"";position:absolute;left:0;right:0;bottom:0;height:2em;background:linear-gradient(0deg,var(--bg),transparent)}
.eps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 12px 16px}
@media(min-width:560px){.eps{grid-template-columns:repeat(8,1fr)}}
.eps button{background:var(--card);border:1px solid var(--line);color:#dcdce6;border-radius:9px;padding:10px 0;font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.eps button:active{background:#2a2a34}
.eps button.cur{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.eps button.seen:after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.eps button.cur.seen:after{background:#fff}

/* ── 播放器 ── */
#pl{position:fixed;top:0;left:0;width:100%;height:100%;z-index:80;background:#000;display:none;overflow:clip;overscroll-behavior:none}
#pl.on{display:block}
#pl .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#pl video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#pl .top{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(env(safe-area-inset-top) + 8px) 10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);transition:opacity .22s}
#pl .top button{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;flex:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pl .top .nm{flex:1;min-width:0;font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;opacity:.94}
#pl .ctr{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:40px 12px calc(env(safe-area-inset-bottom) + 9px);background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.34) 58%,transparent);transition:opacity .22s}
#pl.hide-ctl .top,#pl.hide-ctl .ctr{opacity:0;pointer-events:none}
#pl .line{display:flex;align-items:center;gap:8px}
#pl .tm{font-size:11.5px;color:#e6e6ee;font-variant-numeric:tabular-nums;flex:none;min-width:38px;text-align:center;opacity:.9}
#pl .sk{--p:0%;--b:0%;flex:1;-webkit-appearance:none;appearance:none;height:26px;background:transparent;outline:none;margin:0;touch-action:none}
#pl .sk::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--acc) 0 var(--p),rgba(255,255,255,.32) var(--p) var(--b),rgba(255,255,255,.13) var(--b))}
#pl .sk::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4.5px;box-shadow:0 0 0 3px rgba(255,77,109,.45)}
#pl .sk::-moz-range-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--acc) 0 var(--p),rgba(255,255,255,.32) var(--p) var(--b),rgba(255,255,255,.13) var(--b))}
#pl .sk::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
#pl .btns{display:flex;align-items:center;gap:7px;margin-top:5px}
#pl .btns .ep-tg{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:12px;padding:7px 11px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
#pl .btns .spd{margin-left:auto;font-weight:600}
#pl .btns .fs{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:30px;border-radius:8px;font-size:15px;line-height:1;flex:none}
/* 中央播放/暂停 */
#pl .big-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:5;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#pl .big-play.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#pl .spin-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:none}
#pl .spin-c.on{display:block}
.spn{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.26);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 倍速面板 */
#pl .spdbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:9;background:rgba(18,18,24,.96);border:1px solid var(--line);border-radius:14px;padding:14px 8px 8px;display:none;min-width:168px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#pl .spdbox.on{display:block}
#pl .spdbox .ttl{font-size:12px;color:var(--dim);text-align:center;margin-bottom:9px}
#pl .spdbox .it{display:flex;flex-direction:column;gap:5px}
#pl .spdbox .it button{background:#1f1f28;border:1px solid transparent;color:#dcdce6;border-radius:9px;padding:9px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
#pl .spdbox .it button.cur{background:rgba(255,77,109,.16);border-color:var(--acc);color:#fff;font-weight:700}
#pl .spdbox .it button i{font-style:normal;color:var(--dim);font-size:11px;margin-left:5px}
/* 手势音量/进度提示 */
#pl .gtoast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.78);color:#fff;font-size:14px;font-weight:600;padding:9px 18px;border-radius:22px;opacity:0;transition:opacity .18s;pointer-events:none;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);white-space:nowrap}
#pl .gtoast.on{opacity:1}
#pl .epbox{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#101015;border-radius:16px 16px 0 0;padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);transform:translateY(101%);transition:transform .26s ease;max-height:62%}
#pl .epbox.on{transform:translateY(0)}
#pl .epbox .hd{display:flex;justify-content:space-between;align-items:center;padding:0 14px 10px;font-size:14px;font-weight:700}
#pl .epbox .nav{display:flex;gap:5px;align-items:center}
#pl .epbox .nav .p{color:var(--dim);font-size:12px;font-weight:400;background:#1c1c24;border:1px solid var(--line);border-radius:7px;padding:4px 10px}
#pl .epbox .hd span{color:var(--dim);font-size:12px;font-weight:400}
#pl .epbox .bd{max-height:44vh;overflow-y:auto;padding:0 12px}
#pl .epbox .eg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:6px}
@media(min-width:560px){#pl .epbox .eg{grid-template-columns:repeat(8,1fr)}}
#pl .epbox .eg button{background:#1c1c24;border:1px solid var(--line);color:#dcdce6;border-radius:8px;padding:10px 0;font-size:13px;font-variant-numeric:tabular-nums;position:relative}
#pl .epbox .eg button.cur{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#pl .nx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;background:rgba(0,0,0,.84);border-radius:12px;padding:15px 20px;text-align:center;display:none;backdrop-filter:blur(6px)}
#pl .nx.on{display:block}
#pl .nx .a{font-size:13.5px;color:#fff}
#pl .nx .b{margin-top:10px;display:flex;gap:8px;justify-content:center}
#pl .nx .b button{border:0;border-radius:8px;padding:8px 16px;font-size:12.5px}
#pl .nx .b .y{background:var(--acc);color:#fff}
#pl .nx .b .n{background:rgba(255,255,255,.16);color:#fff}
#pl .err{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.9)}
#pl .err.on{display:flex}
#pl .err .c{background:#17171e;border:1px solid var(--line);border-radius:14px;padding:20px 18px;max-width:340px;width:100%;text-align:center}
#pl .err .t{font-size:15px;font-weight:700;margin-bottom:6px}
#pl .err .s{font-size:12.5px;color:var(--dim);line-height:1.65;margin-bottom:14px}
#pl .err .a{display:flex;gap:8px}
#pl .err .a button{flex:1;border:0;border-radius:9px;padding:10px 0;font-size:13px;background:#26262f;color:#fff}
#pl .err .a button.p{background:var(--acc);font-weight:600}

/* ── 底栏 ── */
#tab{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(12,12,15,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tab button{flex:1;background:none;border:0;color:var(--dim2);font-size:10.5px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tab button .ic{font-size:17px;line-height:1;filter:grayscale(1);opacity:.72}
#tab button.on{color:var(--acc)}
#tab button.on .ic{filter:none;opacity:1}

#tip{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
#tip.on{opacity:1}
.empty{text-align:center;color:var(--dim);padding:64px 20px;font-size:14px}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
.loading{text-align:center;padding:44px 0}
.skel{background:linear-gradient(90deg,#16161c,#1f1f27,#16161c);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:11px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<header id="hdr">
  <div class="bar">
    <div class="brand">短剧<b>·</b>H5</div>

<script>
/* ═════════ 基础工具 ═════════ */
var $=function(id){return document.getElementById(id)};
var BASES=[
 "https://thu.kozhmami.cc","https://pku.kozhmami.cc","https://fdu.kozhmami.cc",
 "https://sjtu.kozhmami.cc","https://zju.kozhmami.cc","https://nju.kozhmami.cc",
 "https://thu.ssenpilj.cc","https://pku.ssenpilj.cc","https://fdu.ssenpilj.cc",
 "https://sjtu.ssenpilj.cc","https://zju.ssenpilj.cc","https://nju.ssenpilj.cc"
];
/* ═════════ 封面：上游是 AES-128-CBC 加密字节，浏览器内 WebCrypto 本地解密 ═════════
   密钥来自 HGhub 源码 src-tauri/src/media.rs:26-27（ASCII 字符串，不是十六进制） */
var IMG_KEY="f5d965df75336270", IMG_IV="97b60394abc2fbe1";
var IMG_CACHE=new Map();      /* url -> Promise<string> 已解密的 blob URL */
var IMG_RAW=new Map();        /* url -> Promise<string> 疑似未加密直链 */
var _imgKeyP=null;
function asciiBytes(str){var a=new Uint8Array(str.length);for(var i=0;i<str.length;i++)a[i]=str.charCodeAt(i)&255;return a}
function imgKey(){
  if(_imgKeyP)return _imgKeyP;
  if(!(self.crypto&&self.crypto.subtle)){_imgKeyP=Promise.resolve(null);return _imgKeyP}
  _imgKeyP=self.crypto.subtle.importKey("raw",asciiBytes(IMG_KEY),{name:"AES-CBC"},false,["decrypt"]).catch(function(e){
    console.warn("[img] importKey 失败",e);return null});
  return _imgKeyP;
}
function abs(u){if(!u)return "";u=String(u);return /^(https?:)?\/\//.test(u)?u:((S.base||"https://thu.kozhmami.cc")+u)}
/* 图片不走 API 域名：/upload_01/... 这类相对路径挂在上游图片 CDN pic.qnlycc.cn 上 */
var IMG_BASE="https://pic.qnlycc.cn";
function absImg(u){
  if(!u)return "";
  u=String(u);
  if(/^https?:\/\//i.test(u))return u;
  if(u.indexOf("//")===0)return "https:"+u;
  return IMG_BASE+(u.charAt(0)==="/"?u:"/"+u);
}
function pic(u){return absImg(u)}
function isPlainImg(b){
  if(!b||b.length<4)return false;
  var h=b[0],i=b[1],j=b[2],k=b[3];
  if(h===0xff&&i===0xd8)return true;                        /* JPEG */
  if(h===0x89&&i===0x50&&j===0x4e&&k===0x47)return true;    /* PNG  */
  if(h===0x47&&i===0x49&&j===0x46)return true;              /* GIF  */
  if(h===0x52&&i===0x49&&j===0x46&&k===0x46)return true;    /* WEBP/RIFF */
  return false;
}
function blobUrl(bytes,mime){
  return URL.createObjectURL(new Blob([bytes],{type:mime||"image/jpeg"}));
}
/* 取一张封面，返回可给 <img src> 用的 URL（已解密） */
function decImg(url){
  if(!url)return Promise.resolve("");
  if(IMG_CACHE.has(url))return IMG_CACHE.get(url);
  var job=(async function(){
    var res=await fetch(url,{mode:"cors",credentials:"omit",cache:"force-cache"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    var buf=new Uint8Array(await res.arrayBuffer());
    if(isPlainImg(buf))return blobUrl(buf);
    var key=await imgKey();
    if(!key)throw new Error("浏览器不支持 WebCrypto");
    var plain=await self.crypto.subtle.decrypt({name:"AES-CBC",iv:asciiBytes(IMG_IV)},key,buf);
    return blobUrl(new Uint8Array(plain));
  })().catch(function(e){
    IMG_CACHE.delete(url);
    console.warn("[img] 解密失败",url,e&&e.message);
    throw e;
  });
  IMG_CACHE.set(url,job);   /* 先放 Promise，并发请求自动复用同一次下载 */
  return job;
}
/* 可见区才解密：省流量、省解码。
   注意：页面所有视图都是 v.innerHTML=... 整块换掉，逐个赋值点插 hydrate() 必然漏，
   改成「IntersectionObserver 观察 + MutationObserver 自动接管新节点」双保险。 */
var _io=null;
function ensureIO(){
  if(_io)return _io;
  if(!("IntersectionObserver" in self))return null;
  _io=new IntersectionObserver(function(ents){
    for(var i=0;i<ents.length;i++){
      var en=ents[i];
      if(!en.isIntersecting)continue;
      _io.unobserve(en.target);
      mountImg(en.target);
    }
  },{rootMargin:"800px 0px"});
  return _io;
}
function observeOne(im){
  if(!im||im.nodeType!==1||im.__hgo)return;
  im.__hgo=1;
  var io=ensureIO();
  if(io)io.observe(im);else mountImg(im);
}
function hydrate(root){
  root=root||document;
  var io=ensureIO();
  if(!io){mountImg(root);return}
  if(root.nodeType===1&&root.hasAttribute&&root.hasAttribute("data-hgu"))observeOne(root);
  var list=root.querySelectorAll?root.querySelectorAll("img[data-hgu]"):[];
  for(var i=0;i<list.length;i++)observeOne(list[i]);
}
var _mo=null;
function autoHydrate(){
  if(_mo||!("MutationObserver" in self)||!document.body)return;
  _mo=new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="attributes"){
        var t=m.target;
        if(t&&t.nodeType===1&&t.hasAttribute&&t.hasAttribute("data-hgu"))observeOne(t);
        continue;
      }
      var adds=m.addedNodes;
      for(var k=0;k<adds.length;k++){
        var n=adds[k];
        if(!n||n.nodeType!==1)continue;
        if(n.hasAttribute&&n.hasAttribute("data-hgu"))observeOne(n);
        var inner=n.querySelectorAll?n.querySelectorAll("img[data-hgu]"):[];
        for(var q=0;q<inner.length;q++)observeOne(inner[q]);
      }
    }
  });
  _mo.observe(document.body,{childList:true,subtree:true});
  hydrate(document);
}
function mountImg(im){
  var u=im.getAttribute("data-hgu");
  im.removeAttribute("data-hgu");
  if(!u)return;
  decImg(u).then(function(src){
    if(!src)return;
    im.onload=function(){im.style.opacity=1};
    im.src=src;
    if(im.complete&&im.naturalWidth)im.style.opacity=1;
  }).catch(function(){
    im.style.opacity=0;
    im.style.background="linear-gradient(135deg,#1a1a20,#242430)";
  });
}
function sweepImg(root){hydrate(root||document)}
/* 后台静态资源：播放器 poster 也走这里 */
function setPoster(vid,cover){
  if(!vid||!cover)return;
  decImg(abs(cover)).then(function(u){if(u)vid.poster=u}).catch(function(){});
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function fmt(n){n=Number(n)||0;if(n>=1e8)return (n/1e8).toFixed(1)+"亿";if(n>=1e4)return (n/1e4).toFixed(n>=1e5?0:1)+"万";return String(n)}
function fmtT(s){s=Math.max(0,Math.floor(Number(s)||0));var m=Math.floor(s/60),ss=s%60;return m+":"+(ss<10?"0":"")+ss}
var tipT;
function tip(m){var e=$("tip");if(!m){e.classList.remove("on");return}e.textContent=m;e.classList.add("on");clearTimeout(tipT);tipT=setTimeout(function(){e.classList.remove("on")},2300)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ═════════ 网络 ═════════ */
var S={base:"",bsIdx:0,cur:null,ep:1,eps:[],hls:null,mode:"",triedNative:false,triedHls:false,curSrc:"",route:"#/home",busy:false,spd:1};
function fetchT(url,opt,ms){
  ms=ms||15000;var ac=new AbortController();var t=setTimeout(function(){ac.abort()},ms);
  opt=opt||{};opt.signal=ac.signal;
  return fetch(url,opt).then(function(r){clearTimeout(t);return r}).catch(function(e){clearTimeout(t);throw e});
}
function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({"Accept":"application/json"},opt.headers||{});
  return fetchT(S.base+path,opt,18000).then(function(r){return r.json()}).then(function(j){
    if(j&&j.status===0){var err=new Error(j.msg||"接口返回异常");err.soft=true;throw err}
    return j;
  });
}
function pickBase(){
  var saved=store("hg.base");
  if(saved){for(var i=0;i<BASES.length;i++)if(BASES[i]===saved){S.base=saved;S.bsIdx=i;return Promise.resolve(saved)}}
  var jobs=BASES.map(function(b,i){
    return fetchT(b+"/api/videos?page=1&size=1",{cache:"no-store"},8000)
      .then(function(r){return r.json()})
      .then(function(j){if(j&&j.data&&j.data.items&&j.data.items.length)return {b:b,i:i};throw 0});
  });
  return new Promise(function(res){
    var done=false,n=0;
    jobs.forEach(function(p){
      p.then(function(v){if(!done){done=true;S.base=v.b;S.bsIdx=v.i;res(v.b)}})
       .catch(function(){if(++n===jobs.length&&!done){done=true;S.base=BASES[0];S.bsIdx=0;res(BASES[0])}});
    });
  });
}

/* 轮播自动播放 + 滑动 */
var bnTimer=null,bnIdx=0,bnN=0;
function startBanner(n){
  bnN=n;bnIdx=0;clearInterval(bnTimer);
  if(n<=1)return;
  var tr=$("bnTr"),dots=$("bnDots");
  if(!tr)return;
  function set(i){
    bnIdx=(i+n)%n;
    tr.style.transform="translateX(-"+(bnIdx*100)+"%)";
    if(dots)for(var k=0;k<dots.children.length;k++)dots.children[k].className=(k===bnIdx?"on":"");
  }
  bnTimer=setInterval(function(){if(!document.hidden)set(bnIdx+1)},4200);
  var sx=0,dx=0,drag=false;
  tr.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;drag=true;dx=0;clearInterval(bnTimer)},{passive:true});
  tr.addEventListener("touchmove",function(e){if(drag)dx=e.touches[0].clientX-sx},{passive:true});
  tr.addEventListener("touchend",function(){
    if(!drag)return;drag=false;
    if(Math.abs(dx)>40)set(bnIdx+(dx<0?1:-1));else set(bnIdx);
    bnTimer=setInterval(function(){if(!document.hidden)set(bnIdx+1)},4200);
  });
}

/* 首页无限流 */
var feedPage=1,feedPages=1,feedMO=null;
function loadFeed(){
  if(S.busy||feedPage>feedPages)return;
  S.busy=true;
  api("/api/videos?page="+feedPage+"&size=20").then(function(j){
    var items=(j.data&&j.data.items)||[];
    if(j.data&&j.data.pagination)feedPages=j.data.pagination.pages||1;
    var g=$("feed");
    if(g&&items.length)g.insertAdjacentHTML("beforeend",items.map(vcard).join(""));
    feedPage++;S.busy=false;
    var m=$("more");
    if(m)m.textContent=(feedPage>feedPages?"— 到底了 —":"加载中…");
    watchFeed();
  }).catch(function(){
    S.busy=false;var m=$("more");if(m)m.textContent="加载失败，下拉刷新";
  });
}
function watchFeed(){
  if(feedMO)feedMO.disconnect();
  var t=$("more");if(!t)return;
  feedMO=new IntersectionObserver(function(es){if(es[0].isIntersecting)loadFeed()},{rootMargin:"600px"});
  feedMO.observe(t);
}

/* ═════════ 播放器（自定义控件 + 双路兜底） ═════════ */
var vid=$("vid"),plOpts={hideTimer:null,nextTimer:null,seekDragging:false};
function isIOS(){
  var u=navigator.userAgent||"";
  if(/iPad|iPhone|iPod/.test(u))return true;
  if(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)return true;
  return false;
}
function isSafari(){var u=navigator.userAgent||"";return /Safari/.test(u)&&!/Chrome|CriOS|Edg|Android/.test(u)}
function nativeHls(){return isIOS()||isSafari()}
var hlsLoading=null;
function loadHlsJs(){
  if(window.Hls)return Promise.resolve();
  if(hlsLoading)return hlsLoading;
  hlsLoading=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js";
    s.onload=res;s.onerror=function(){hlsLoading=null;rej(new Error("播放引擎加载失败"))};
    document.head.appendChild(s);
  });
  return hlsLoading;
}
function destroyHls(){if(S.hls){try{S.hls.destroy()}catch(e){}S.hls=null}}

function plShow(){var p=$("pl");p.classList.add("on");p.classList.remove("hide-ctl");p.scrollTop=0;p.scrollLeft=0}
function plHide(){var pp=$("pl");pp.classList.remove("on");pp.scrollTop=0;try{vid.pause();vid.removeAttribute("src");vid.load()}catch(e){}destroyHls();}
function plSpin(on){$("plSpin").classList.toggle("on",!!on)}
function plErr(title,sub,canNative){
  plSpin(false);
  $("peT").textContent=title;
  $("peS").textContent=sub||"";
  $("peNative").style.display=canNative?"":"none";
  $("plErr").classList.add("on");
}
function plErrHide(){$("plErr").classList.remove("on")}

function play(ep){
  if(!S.cur)return;
  if(!S.eps.length)S.eps=[{ep_num:1}];
  S.ep=ep;
  S.triedNative=false;S.triedHls=false;
  var d=S.cur;
  plShow();plErrHide();plSpin(true);
  $("plName").textContent=d.title+" · 第"+ep+"集";
  decImg(absImg(d.cover)).then(function(u){vid.poster=u||""});
  $("plNext").classList.remove("on");
  $("spdBox").classList.remove("on");
  clearTimeout(plOpts.nextTimer);
  savePos(d.id,ep);
  renderPlayerEps();
  tip("");
  fetchT(S.base+"/api/videos/"+d.id+"/episodes/"+ep+"/playback",{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:""
  },25000).then(function(r){return r.json()}).then(function(j){
    var st=(j.data&&j.data.streams)||{};
    var url=st.main||st.hevc||j.data&&j.data.video_url||"";
    if(!url)throw new Error("这一集还没有可用片源");
    S.curSrc=url;
    if(nativeHls())useNative(url);else useHls(url);
  }).catch(function(e){
    plSpin(false);
    var m=String(e.message||"");
    if(/abort|timeout/i.test(m))plErr("加载超时","线路响应太慢，可换一条线路或重试。",false);
    else if(/Failed to fetch|NetworkError|load failed/i.test(m))plErr("网络请求被拦截","可能是线路不可用。换个线路再试。",false);
    else plErr("拿不到播放地址",m||"上游返回异常，换条线路重试。",false);
  });
}

function useHls(src){
  S.mode="hls";
  loadHlsJs().then(function(){
    if(!window.Hls||!Hls.isSupported()){useNative(src);return}
    destroyHls();
    var H=window.Hls;
    S.hls=new H({
      enableWorker:true,lowLatencyMode:false,
      maxBufferLength:24,maxMaxBufferLength:48,
      manifestLoadingTimeOut:20000,manifestLoadingMaxRetry:3,
      fragLoadingTimeOut:30000,fragLoadingMaxRetry:4,fragLoadingRetryDelay:700
    });
    S.hls.attachMedia(vid);
    S.hls.on(H.Events.MANIFEST_PARSED,function(){
      plSpin(false);
      resumeSeek();
      vid.play().catch(function(){/* 等用户点击 */});
    });
    S.hls.on(H.Events.ERROR,function(_,dd){
      if(!dd||!dd.fatal)return;
      var t=String(dd.details||dd.type||"");
      if(/(manifest|level|frag|Load|network)/i.test(t)&&!S.triedNative){
        S.triedNative=true;tip("换用系统播放器重试");useNative(src);return;
      }
      plSpin(false);
      plErr("播放失败",hlsErrText(t),true);
    });
    S.hls.loadSource(src);
  }).catch(function(){
    useNative(src);
  });
}
function hlsErrText(d){
  d=String(d||"");
  if(/manifestLoad/i.test(d))return "播放清单加载失败（线路或防盗链问题）";
  if(/manifestParsed|manifestIncompatibleCodecs/i.test(d))return "播放清单解析失败（线路返回异常）";
  if(/levelLoad/i.test(d))return "码率清单加载失败";
  if(/fragLoad|fragParsing/i.test(d))return "视频分片加载失败";
  if(/keyLoad/i.test(d))return "解密密钥加载失败";
  if(/bufferAppend/i.test(d))return "视频解码失败（该编码不被支持）";
  if(/bufferStalled/i.test(d))return "缓冲卡住，网速不够";
  if(/networkError/i.test(d))return "网络错误，视频流拉取失败";
  return "播放出错："+(d||"未知原因");
}
function useNative(src){
  S.mode="native";
  destroyHls();
  vid.src=src;vid.load();
  vid.play().catch(function(){});
}
function resumeSeek(){
  try{
    var p=JSON.parse(store("hg.pos")||"null");
    if(!p||!S.cur||p.id!==S.cur.id||p.ep!==S.ep)return;
    var t=parseFloat(store("hg.t")||"0");
    if(t>5&&t<((vid.duration||1e9)-15)&&Math.abs(vid.currentTime-t)>10){
      vid.currentTime=t;
      tip("从 "+fmtT(t)+" 继续");
    }
  }catch(e){}
}
function savePos(id,ep){
  try{store("hg.pos",JSON.stringify({id:id,ep:ep,t:S.cur?S.cur.title:""}))}catch(e){}
}
/* 每 5 秒记播放位置 */
setInterval(function(){
  try{
    if(S.cur&&!vid.paused&&vid.currentTime>5){
      var p=JSON.parse(store("hg.pos")||"null");
      if(p&&p.id===S.cur.id&&p.ep===S.ep)store("hg.t",String(Math.floor(vid.currentTime)));
    }
  }catch(e){}
},5000);

/* 选集抽屉 */
function renderPlayerEps(){
  var eps=S.eps.length?S.eps:[{ep_num:1}];
  $("epCnt").textContent="共 "+eps.length+" 集";
  var h="";
  for(var i=0;i<eps.length;i++){
    var n=eps[i].ep_num;
    h+='<button class="'+(n===S.ep?"cur":"")+'" data-e="'+n+'">'+n+'</button>';
  }
  var g=$("epGrid");g.innerHTML=h;
  g.querySelectorAll("[data-e]").forEach(function(b){
    b.onclick=function(){$("epBox").classList.remove("on");play(Number(b.dataset.e))};
  });
  var cur=g.querySelector(".cur");
  if(cur)setTimeout(function(){
    /* 只滚选集抽屉自己的 .bd，绝不用 scrollIntoView（它会把整层 #pl 一起滚上去，导致播放器画面被顶飞） */
    var bd=document.querySelector("#epBox .bd");
    if(!bd)return;
    var t=cur.offsetTop-g.offsetTop;
    if(t<0||t+cur.offsetHeight>bd.scrollTop+bd.clientHeight)bd.scrollTop=Math.max(0,t-8);
  },50);
}
function prevEp(){
  var eps=S.eps.length?S.eps:[{ep_num:1}];
  for(var i=0;i<eps.length;i++)if(eps[i].ep_num===S.ep&&i>0)return eps[i-1].ep_num;
  return null;
}
function nextEp(){
  var eps=S.eps.length?S.eps:[{ep_num:1}];
  for(var i=0;i<eps.length;i++)if(eps[i].ep_num===S.ep&&eps[i+1])return eps[i+1].ep_num;
  return null;
}

/* 播放器事件 */
function syncBigPlay(){
  var b=$("bigPlay");
  if(!b)return;
  b.textContent=vid.paused?"▶":"❚❚";
  b.classList.toggle("show",vid.paused);
}
function paintSeek(){
  var el=$("sk");if(!el)return;
  var d=vid.duration||0,cur=vid.currentTime||0;
  var pct=d?Math.min(100,Math.max(0,cur/d*100)):0;
  var buf=0;
  try{if(vid.buffered&&vid.buffered.length)buf=Math.min(100,Math.max(pct,vid.buffered.end(vid.buffered.length-1)/d*100))}catch(e){}
  el.style.setProperty("--p",pct.toFixed(2)+"%");
  el.style.setProperty("--b",buf.toFixed(2)+"%");
}
vid.addEventListener("play",function(){
  syncBigPlay();plShowCtl();
});
vid.addEventListener("pause",function(){syncBigPlay()});
vid.addEventListener("playing",function(){plSpin(false);syncBigPlay()});
vid.addEventListener("canplay",function(){plSpin(false)});
vid.addEventListener("waiting",function(){plSpin(true)});
vid.addEventListener("loadedmetadata",function(){
  $("tmDur").textContent=fmtT(vid.duration);
  paintSeek();
  if(S.mode==="native")resumeSeek();
});
vid.addEventListener("progress",paintSeek);
vid.addEventListener("timeupdate",function(){
  if(plOpts.seekDragging)return;
  $("tmCur").textContent=fmtT(vid.currentTime);
  if(vid.duration)$("sk").value=String(Math.round(vid.currentTime/vid.duration*1000));
  paintSeek();
});
vid.addEventListener("ended",function(){
  var nx=nextEp();
  if(!nx){tip("已经是最后一集");return}
  $("plNextT").textContent="即将播放第 "+nx+" 集";
  $("plNext").classList.add("on");
  clearTimeout(plOpts.nextTimer);
  plOpts.nextTimer=setTimeout(function(){$("plNext").classList.remove("on");play(nx)},5000);
});
vid.addEventListener("error",function(){
  var m="";
  try{var c=vid.error&&vid.error.code;
    m=c===2?"网络异常，视频数据加载失败":c===3?"视频解码失败（浏览器不支持该编码）":c===4?"当前浏览器不支持该视频格式":"播放器报错";
  }catch(e){}
  if(S.mode==="native"&&!S.triedHls&&window.Hls&&Hls.isSupported()){
    S.triedHls=true;tip("换用 hls.js 重试");useHls(S.curSrc);return;
  }
  plSpin(false);
  plErr("播放失败",m,true);
});

function plShowCtl(){
  var p=$("pl");p.classList.remove("hide-ctl");
  clearTimeout(plOpts.hideTimer);
  plOpts.hideTimer=setTimeout(function(){if(!vid.paused)p.classList.add("hide-ctl")},2800);
}
$("pl").addEventListener("click",function(e){
  if(e.target.closest(".ctr")||e.target.closest(".top")||e.target.closest(".epbox")||e.target.closest(".err")||e.target.closest(".nx"))return;
  if($("pl").classList.contains("hide-ctl"))plShowCtl();else $("pl").classList.add("hide-ctl");
});
$("bigPlay").onclick=function(e){e.stopPropagation();if(vid.paused)vid.play().catch(function(){});else vid.pause()};

/* ── 倍速 ── */
var SPDS=[0.5,0.75,1,1.25,1.5,2];
function setSpd(v,silent){
  S.spd=v||1;
  try{vid.playbackRate=S.spd}catch(e){}
  store("hg.spd",String(S.spd));
  $("spdTg").textContent=(S.spd===1?"1.0":String(S.spd))+"×";
  var bs=$("spdList").querySelectorAll("[data-s]");
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle("cur",Number(bs[i].dataset.s)===S.spd);
  if(!silent)tip("已切换 "+(S.spd===1?"正常速度":S.spd+" 倍速"));
}
$("spdTg").onclick=function(e){e.stopPropagation();plShowCtl();$("spdBox").classList.toggle("on")};
$("spdList").addEventListener("click",function(e){
  var b=e.target.closest("[data-s]");if(!b)return;
  e.stopPropagation();setSpd(Number(b.dataset.s));$("spdBox").classList.remove("on");
});
$("pl").addEventListener("click",function(e){
  if(!e.target.closest(".spdbox")&&!e.target.closest(".spd")){var sb=$("spdBox");if(sb&&sb.classList.contains("on"))sb.classList.remove("on")}
},true);

/* ── 长按 2 倍速快放（松手恢复） ── */
var holdT=null,holding=false,spdBack=1;
var vwrap=document.querySelector("#pl .wrap");
vwrap.addEventListener("pointerdown",function(e){
  if(e.target.closest("button")||e.target.closest(".ctr")||e.target.closest(".top")||e.target.closest(".epbox")||e.target.closest(".spdbox")||e.target.closest(".err"))return;
  clearTimeout(holdT);
  holdT=setTimeout(function(){
    if(vid.paused)return;
    holding=true;spdBack=S.spd||1;
    try{vid.playbackRate=2}catch(e){}
    showGToast("2× 快放中");
  },380);
});
function endHold(){
  clearTimeout(holdT);
  if(holding){holding=false;try{vid.playbackRate=S.spd||1}catch(e){}hideGToast()}
}
vwrap.addEventListener("pointerup",endHold);
vwrap.addEventListener("pointercancel",endHold);
vwrap.addEventListener("pointerleave",endHold);
var gT=null;
function showGToast(txt){var g=$("gToast");if(!g)return;g.textContent=txt;g.classList.add("on");clearTimeout(gT);gT=null}
function hideGToast(){var g=$("gToast");if(!g)return;clearTimeout(gT);gT=setTimeout(function(){g.classList.remove("on")},260)}
$("sk").addEventListener("input",function(){plOpts.seekDragging=true});
$("sk").addEventListener("change",function(){
  if(vid.duration)vid.currentTime=(Number(this.value)/1000)*vid.duration;
  plOpts.seekDragging=false;plShowCtl();
});
$("sk").addEventListener("pointerup",function(){plOpts.seekDragging=false});
function toFull(){
  if(typeof vid.webkitEnterFullscreen==="function")vid.webkitEnterFullscreen();
  else if(typeof $("pl").requestFullscreen==="function")$("pl").requestFullscreen().catch(function(){});
  else if(typeof vid.requestFullscreen==="function")vid.requestFullscreen().catch(function(){});
}
$("btnFs").onclick=function(e){e.stopPropagation();toFull()};
$("btnFs2").onclick=function(e){e.stopPropagation();toFull()};
$("btnBack").onclick=function(){plHide()};
$("epTg").onclick=function(e){e.stopPropagation();plShowCtl();$("epBox").classList.toggle("on")};
$("epClose").onclick=function(){$("epBox").classList.remove("on")};
$("epPrev").onclick=function(){var p2=prevEp();if(p2){$("epBox").classList.remove("on");play(p2)}else tip("已经是第一集")};
$("epNext").onclick=function(){var n2=nextEp();if(n2){$("epBox").classList.remove("on");play(n2)}else tip("已经是最后一集")};
$("nextTg").onclick=function(){
  var nx=nextEp();
  if(!nx){tip("已经是最后一集");return}
  $("nextTg").textContent="第"+nx+"集";
  setTimeout(function(){$("nextTg").textContent="下一集"},1200);
  play(nx);
};
$("plNextY").onclick=function(){clearTimeout(plOpts.nextTimer);$("plNext").classList.remove("on");var nx=nextEp();if(nx)play(nx)};
$("plNextN").onclick=function(){clearTimeout(plOpts.nextTimer);$("plNext").classList.remove("on")};
$("peRetry").onclick=function(){plErrHide();play(S.ep)};
$("peNative").onclick=function(){plErrHide();if(S.curSrc)useNative(S.curSrc)};

/* ═════════ 路由 ═════════ */
function go(h){if(location.hash===h)route();else location.hash=h}
function setTab(r){
  var btns=document.querySelectorAll("#tab button");
  for(var i=0;i<btns.length;i++){
    var t=btns[i].dataset.r;
    var on=(t==="#/home"&&r==="#/home")||(t.indexOf("#/cat")===0&&r.indexOf("#/cat")===0)||t===r;
    btns[i].classList.toggle("on",on);
  }
}
function route(){
  var h=location.hash||"#/home";
  S.route=h;
  var m;
  if((m=h.match(/^#\/v\/(\d+)/))){setTab(h);viewDetail(parseInt(m[1],10));return}
  if((m=h.match(/^#\/cat\/(\d+)/))){setTab("#/cat");viewCat(parseInt(m[1],10));return}
  if((m=h.match(/^#\/catall\/(\d+)/))){setTab("#/cat");viewCatAll(parseInt(m[1],10));return}
  if((m=h.match(/^#\/topic\/(.+)$/))){setTab("#/topic");viewTopic(decodeURIComponent(m[1]));return}
  if(h.indexOf("#/topic")===0){setTab("#/topic");viewTopicList();return}
  if(h.indexOf("#/cat")===0){setTab("#/cat");viewCat();return}
  if(h.indexOf("#/rank")===0){setTab("#/rank");viewRank();return}
  if(h.indexOf("#/search")===0){setTab("#/search");var kw=$("q").value.trim();viewSearch(kw);return}
  setTab("#/home");viewHome();
}
window.addEventListener("hashchange",route);
document.querySelectorAll("#tab button").forEach(function(b){b.onclick=function(){go(b.dataset.r)}});

/* 搜索框 */
var qT=null;
$("q").addEventListener("input",function(){
  clearTimeout(qT);
  var kw=this.value.trim();
  qT=setTimeout(function(){
    if(kw){if(location.hash.indexOf("#/search")!==0)go("#/search");else viewSearch(kw)}
    else if(location.hash.indexOf("#/search")===0)viewSearch("");
  },450);
});
$("q").addEventListener("keydown",function(e){
  if(e.key==="Enter"){this.blur();clearTimeout(qT);var kw=this.value.trim();if(kw){go("#/search");viewSearch(kw)}}
});

/* 线路切换 */
$("btnLine").onclick=function(){
  S.bsIdx=(S.bsIdx+1)%BASES.length;
  S.base=BASES[S.bsIdx];
  store("hg.base",S.base);
  $("btnLine").textContent="线路"+(S.bsIdx+1);
  tip("已切到线路 "+(S.bsIdx+1)+"："+S.base.replace("https://",""));
  route();
};
window.addEventListener("popstate",function(){if($("pl").classList.contains("on"))plHide()});

/* 启动 */
autoHydrate();
(function(){var v0=Number(store("hg.spd")||"1");if(v0&&v0!==1)setSpd(v0,true)})();
pickBase().then(function(b){
  if(!b){
    $("view").innerHTML='<div class="empty"><div class="big">📡</div>所有线路都连不上<br><br><button class="chip" onclick="location.reload()">重新加载</button></div>';
    return;
  }
  $("btnLine").textContent="线路"+(S.bsIdx+1);
  route();
});
</script>
</body>
</html>
